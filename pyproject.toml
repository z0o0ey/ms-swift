[tool.ruff]
line-length = 120
exclude = [
    "docs/src",
    "*.pyi",
    ".git",
    "peft.py",
]

[tool.ruff.lint]
# flake8: B=bugbear, C4=comprehensions, E=pycodestyle errors, F=pyflakes, W=pycodestyle warnings
# isort and double-quote-string-fixer are handled by standalone pre-commit hooks, not ruff
select = ["B", "C4", "E", "F", "W"]
ignore = [
    "F401", "F403", "F405", "F821",
    "B905", "B007", "B023", "B904",
    "B006", "B028", "B030", "B026", "B018", "B027", "B024", "B011", "B008", "B004",
    "C419", "C416", "C408", "C401", "C403", "C400", "C414",
    "E501",  # ruff counts display width (CJK chars = 2), unlike flake8 which counts chars
]

[tool.ruff.lint.per-file-ignores]
# Long strings (e.g. Chinese) in tests
"tests/**/*.py" = ["E501"]
# Relax checks for examples
"examples/**/*.py" = ["E501", "E402"]
# Skip import position and line length for notebooks
"*.ipynb" = ["E402", "E501"]
# Long prompt strings in agent_template
"swift/agent_template/**/*.py" = ["E501"]
# Long report strings in scripts
"scripts/**/*.py" = ["E501"]
